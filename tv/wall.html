<!--
  ═══════════════════════════════════════════════════════════════════
  IDEATIOUS WALL — TV dashboard. CLAUDE PROTOCOL (read me first)
  ═══════════════════════════════════════════════════════════════════
  This page is a published Claude Artifact ("Ideatious Wall") shown
  full-screen on Josh's TV. It renders entirely from the artifact's
  shared database and switches views in ~1s via a realtime
  subscription. To drive it from ANY Claude session, use the Artifact
  tool's read_db / write_db actions against this artifact's URL.
  Never republish the page just to change data — write the db docs.

  ── Switch what the TV shows ──────────────────────────────────────
  write_db  db_op:update  collection:"tv" doc_id:"state"
    data: { "view": "home" | "weather" | "snow" | "note",
            "note": "optional message shown on the note view",
            "updatedAt": "<ISO timestamp>" }

  ── Refresh weather ("update the TV weather") ─────────────────────
  Fetch Queenstown forecast (MetService per Josh's metservice-weather
  skill; any reputable source works), then:
  write_db  db_op:set  collection:"tv" doc_id:"weather"
    data: { "location": "Queenstown", "source": "MetService",
            "fetchedAt": "<ISO>",
            "current": { "temp": 12, "icon": "🌦", "condition": "Showers",
                         "wind": "NW 25 km/h", "humidity": "68%" },
            "days": [ { "day": "Mon", "date": "2026-09-07", "icon": "🌧",
                        "high": 11, "low": 3, "rain": "80%",
                        "text": "Rain developing" }, ... up to 7 ] }
  Icons: any single weather emoji. Unknown values: omit the key
  (page shows an em-dash). NEVER invent numbers.

  ── Refresh snow cams ("update the snow cam") ─────────────────────
  For each resort fetch the latest webcam still (see tv/README.md in
  the JoshAtIdeatious/website repo for cam URL patterns), downscale to
  ≤1000px wide JPEG (~quality 55) so base64 stays under 200,000 chars
  (db doc limit is 256 KiB), then per resort:
  write_db  db_op:set  collection:"cams"
    doc_id: "coronet" | "remarks" | "cardrona"
    data: { "name": "Coronet Peak", "fetchedAt": "<ISO>",
            "image": "data:image/jpeg;base64,...",
            "source": "coronetpeak.co.nz",
            "report": { "status": "Open", "base": "85 cm",
                        "lifts": "6/7", "note": "≤12 words" } }

  Sessions on restricted-egress environments can't fetch these sites;
  do the fetching from a session with normal network access.
  Page source of truth: tv/wall.html in the JoshAtIdeatious/website
  repo (edit there, then republish to this same artifact URL). Full
  protocol + cam source URLs: tv/README.md in that repo.
  ═══════════════════════════════════════════════════════════════════
-->
<title>Ideatious Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Josh's house style, scaled for a 10-foot wall display. Single
     committed dark theme — this page lives on a TV in a dim room. */
  :root{
    --ground:#0d0f12; --surface:#14171c; --panel:#1a1e24;
    --line:#23272e; --line-soft:#1d2127;
    --ink:#e8e4dc; --ink-mid:#c8cdd5; --muted:#8b909a; --dim:#6b7079;
    --lamp:#e6c98a;            /* the Ideatious bulb, dimmed to lamplight */
    --good:#9fe0b0; --good-bg:rgba(74,222,128,.12); --good-line:rgba(74,222,128,.25);
    --warn:#e6c98a; --warn-bg:rgba(230,201,138,.12); --warn-line:rgba(230,201,138,.28);
    --off:#9aa0aa;  --off-bg:rgba(154,160,170,.1);   --off-line:rgba(154,160,170,.22);
    --serif:'DM Serif Display',Georgia,serif;
    --sans:'DM Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);
    overflow:hidden;font-size:clamp(14px,1.4vmin,22px)}
  body.hide-cursor{cursor:none}

  .wall{height:100vh;display:flex;flex-direction:column;padding:3.2vmin 3.6vmin 2.2vmin}

  /* ── top bar ─────────────────────────────────────────────── */
  .top{display:flex;align-items:baseline;gap:1.6vmin;padding-bottom:2vmin;
    border-bottom:1px solid var(--line-soft)}
  .brand{font-family:var(--serif);font-size:2.6vmin;letter-spacing:.06em;color:var(--ink)}
  .brand .dot{color:var(--lamp)}
  .viewname{font-size:1.5vmin;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .topclock{margin-left:auto;font-family:var(--serif);font-size:3vmin;
    font-variant-numeric:tabular-nums;color:var(--ink-mid)}
  .topdate{font-size:1.6vmin;color:var(--muted)}

  /* ── view container ──────────────────────────────────────── */
  main{flex:1;position:relative;min-height:0}
  .view{position:absolute;inset:0;padding-top:2.6vmin;display:none;
    opacity:0;transition:opacity .45s ease}
  .view.on{display:flex;flex-direction:column}
  .view.shown{opacity:1}
  @media (prefers-reduced-motion: reduce){.view{transition:none}}

  /* ── home ────────────────────────────────────────────────── */
  #view-home.on{flex-direction:row;gap:3vmin}
  .home-left{flex:1.15;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .home-clock{font-family:var(--serif);font-size:17vmin;line-height:.95;
    font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .home-clock .sec{font-size:5vmin;color:var(--dim);margin-left:1vmin}
  .home-date{margin-top:1.6vmin;font-size:2.6vmin;color:var(--muted)}
  .home-note{margin-top:4vmin;font-size:2.2vmin;line-height:1.5;color:var(--ink-mid);
    border-left:2px solid var(--lamp);padding-left:1.8vmin;max-width:36ch;display:none}
  .home-right{flex:1;display:flex;flex-direction:column;gap:2.2vmin;min-width:0;justify-content:center}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:1.6vmin;
    padding:2.2vmin 2.6vmin}
  .pname{font-family:var(--serif);font-size:2.4vmin;display:flex;
    justify-content:space-between;align-items:center;gap:1vmin}
  .pname small{font-size:1.3vmin;font-family:var(--sans);color:var(--dim);
    letter-spacing:.1em;text-transform:uppercase}
  .home-now{display:flex;align-items:baseline;gap:1.6vmin;margin-top:1.4vmin}
  .home-now .bignum{font-family:var(--serif);font-size:6.4vmin;line-height:1;
    font-variant-numeric:tabular-nums}
  .home-now .cond{font-size:2vmin;color:var(--muted)}
  .ministrip{display:flex;margin-top:1.8vmin;border-top:1px solid var(--line-soft)}
  .ministrip .cell{flex:1;text-align:center;padding-top:1.4vmin}
  .cl{font-size:1.3vmin;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .ci{font-size:2.4vmin;margin-top:.5vmin}
  .cv{font-size:1.9vmin;font-weight:600;margin-top:.5vmin;font-variant-numeric:tabular-nums}
  .cvsub{font-size:1.5vmin;color:var(--dim);font-variant-numeric:tabular-nums}
  .snowrows{margin-top:1vmin}
  .stat{display:flex;justify-content:space-between;align-items:center;gap:1.4vmin;
    padding:1.1vmin 0;border-top:1px solid var(--line-soft);font-size:1.8vmin}
  .stat:first-child{border-top:0}
  .stat span{color:var(--muted)}
  .stat b{font-weight:500;font-variant-numeric:tabular-nums}

  .badge{font-size:1.2vmin;letter-spacing:.08em;text-transform:uppercase;
    padding:.5vmin 1.2vmin;border-radius:2vmin;white-space:nowrap}
  .badge.open{color:var(--good);background:var(--good-bg);border:1px solid var(--good-line)}
  .badge.warn{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
  .badge.off{color:var(--off);background:var(--off-bg);border:1px solid var(--off-line)}

  /* ── weather view ────────────────────────────────────────── */
  .wx-hero{display:flex;align-items:baseline;gap:2.6vmin;padding:1vmin 0 2.4vmin}
  .wx-hero .bignum{font-family:var(--serif);font-size:12vmin;line-height:1;
    font-variant-numeric:tabular-nums}
  .wx-hero .icon{font-size:7vmin}
  .wx-hero .meta{font-size:2.2vmin;color:var(--muted);line-height:1.6}
  .wx-hero .meta b{color:var(--ink-mid);font-weight:500}
  .wx-days{flex:1;display:flex;gap:1.6vmin;align-items:stretch;min-height:0}
  .wx-day{flex:1;background:var(--panel);border:1px solid var(--line);
    border-radius:1.6vmin;padding:2.4vmin 1vmin;text-align:center;
    display:flex;flex-direction:column;justify-content:center;gap:1vmin}
  .wx-day .cl{font-size:1.6vmin}
  .wx-day .ci{font-size:4.6vmin;margin:0}
  .wx-day .hi{font-family:var(--serif);font-size:3.4vmin;font-variant-numeric:tabular-nums}
  .wx-day .lo{font-size:2vmin;color:var(--dim);font-variant-numeric:tabular-nums}
  .wx-day .rain{font-size:1.5vmin;color:var(--muted)}
  .wx-day .txt{font-size:1.4vmin;color:var(--dim);font-style:italic;line-height:1.4}

  /* ── snow view ───────────────────────────────────────────── */
  .snow-grid{flex:1;display:flex;gap:2.2vmin;min-height:0}
  .cam{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:1.6vmin;
    padding:2vmin;display:flex;flex-direction:column;gap:1.4vmin;min-width:0}
  .cam-frame{flex:1;min-height:0;border-radius:1vmin;overflow:hidden;background:var(--surface);
    border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;
    position:relative}
  .cam-frame img{width:100%;height:100%;object-fit:cover;display:none}
  .cam-empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.2vmin;
    align-items:center;justify-content:center;color:var(--dim);font-size:1.5vmin}
  .cam-empty svg{width:9vmin;height:6vmin;opacity:.55}
  .cam-stats .stat{font-size:1.6vmin;padding:.9vmin 0}
  .cam-when{font-size:1.3vmin;color:var(--dim)}

  /* ── note view ───────────────────────────────────────────── */
  #view-note.on{align-items:center;justify-content:center;text-align:center}
  .note-big{font-family:var(--serif);font-size:6.5vmin;line-height:1.25;
    max-width:26ch;text-wrap:balance}
  .note-hint{margin-top:3vmin;font-size:1.8vmin;color:var(--dim)}

  /* ── footer ──────────────────────────────────────────────── */
  .foot{display:flex;align-items:center;gap:2.4vmin;padding-top:1.8vmin;
    border-top:1px solid var(--line-soft);font-size:1.4vmin;color:var(--dim)}
  .foot .hint{font-style:italic}
  .foot .right{margin-left:auto;display:flex;align-items:center;gap:1vmin;
    font-variant-numeric:tabular-nums}
  .live-dot{width:.9vmin;height:.9vmin;border-radius:50%;background:var(--off)}
  .live-dot.on{background:var(--good)}
</style>

<div class="wall">
  <header class="top">
    <span class="brand">ıdeatious<span class="dot">.</span></span>
    <span class="viewname" id="viewname">home</span>
    <span class="topclock" id="topclock">--:--</span>
    <span class="topdate" id="topdate"></span>
  </header>

  <main>
    <!-- HOME -->
    <section class="view" id="view-home">
      <div class="home-left">
        <div class="home-clock" id="homeclock">--:--</div>
        <div class="home-date" id="homedate"></div>
        <div class="home-note" id="homenote"></div>
      </div>
      <div class="home-right">
        <div class="panel">
          <div class="pname">Queenstown <small id="home-wx-when">weather</small></div>
          <div class="home-now">
            <span class="bignum" id="home-temp">—</span>
            <span class="cond" id="home-cond">awaiting first update</span>
          </div>
          <div class="ministrip" id="home-days"></div>
        </div>
        <div class="panel">
          <div class="pname">The hill <small id="home-snow-when">snow</small></div>
          <div class="snowrows" id="home-snow"></div>
        </div>
      </div>
    </section>

    <!-- WEATHER -->
    <section class="view" id="view-weather">
      <div class="wx-hero">
        <span class="icon" id="wx-icon"></span>
        <span class="bignum" id="wx-temp">—</span>
        <span class="meta" id="wx-meta">Ask Claude: <b>“update the TV weather”</b></span>
      </div>
      <div class="wx-days" id="wx-days"></div>
    </section>

    <!-- SNOW -->
    <section class="view" id="view-snow">
      <div class="snow-grid" id="snow-grid"></div>
    </section>

    <!-- NOTE -->
    <section class="view" id="view-note">
      <div class="note-big" id="note-text">Nothing on the board.</div>
      <div class="note-hint">Say: “put a note on the TV”</div>
    </section>
  </main>

  <footer class="foot">
    <span class="hint">Talk to Claude: “show the snow cams” · “show the weather” · “back to home”</span>
    <span id="freshness"></span>
    <span class="right"><span class="live-dot" id="livedot"></span><span id="livelabel">connecting</span></span>
  </footer>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const DASH = "—";
  const RESORTS = [
    { id: "coronet",  name: "Coronet Peak" },
    { id: "remarks",  name: "The Remarkables" },
    { id: "cardrona", name: "Cardrona" },
  ];
  const VIEWS = ["home", "weather", "snow", "note"];

  /* ── clock ─────────────────────────────────────────────── */
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTHS = ["January","February","March","April","May","June","July",
                  "August","September","October","November","December"];
  function tick() {
    const n = new Date();
    const hh = String(n.getHours()).padStart(2, "0");
    const mm = String(n.getMinutes()).padStart(2, "0");
    const date = `${DAYS[n.getDay()]} ${n.getDate()} ${MONTHS[n.getMonth()]}`;
    $("topclock").textContent = `${hh}:${mm}`;
    $("topdate").textContent = date;
    $("homeclock").textContent = `${hh}:${mm}`;
    $("homedate").textContent = date;
  }
  tick();
  setInterval(tick, 5000);

  /* ── view switching ────────────────────────────────────── */
  let current = "";
  function showView(name) {
    if (!VIEWS.includes(name)) name = "home";
    if (name === current) return;
    current = name;
    $("viewname").textContent = name;
    for (const v of VIEWS) {
      const el = $("view-" + v);
      const on = v === name;
      el.classList.toggle("on", on);
      requestAnimationFrame(() => el.classList.toggle("shown", on));
    }
  }
  showView("home");

  /* ── tiny safe-DOM helpers (db data is untrusted) ──────── */
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  const str = (v, fb = DASH) => (typeof v === "string" && v.trim()) ? v.trim() : fb;
  const num = (v, fb = DASH) => (typeof v === "number" && isFinite(v)) ? String(Math.round(v)) : fb;
  function ago(iso) {
    const t = Date.parse(iso || "");
    if (isNaN(t)) return null;
    const m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 2) return "just now";
    if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60);
    if (h < 36) return `${h} h ago`;
    return `${Math.round(h / 24)} d ago`;
  }

  /* ── weather rendering ─────────────────────────────────── */
  function renderWeather(d) {
    d = d || {};
    const cur = d.current || {};
    const when = ago(d.fetchedAt);

    $("home-temp").textContent = num(cur.temp) + (typeof cur.temp === "number" ? "°" : "");
    $("home-cond").textContent = str(cur.condition, "awaiting first update");
    $("home-wx-when").textContent = when ? "updated " + when : "weather";

    $("wx-icon").textContent = str(cur.icon, "");
    $("wx-temp").textContent = num(cur.temp) + (typeof cur.temp === "number" ? "°" : "");
    const meta = $("wx-meta");
    meta.textContent = "";
    if (cur.condition || cur.wind || cur.humidity) {
      meta.append(el("b", "", str(cur.condition, "")));
      const bits = [];
      if (cur.wind) bits.push(str(cur.wind));
      if (cur.humidity) bits.push("humidity " + str(cur.humidity));
      meta.append(el("div", "", bits.join(" · ")));
      meta.append(el("div", "", [str(d.location, "Queenstown"),
        d.source ? "via " + str(d.source) : null, when].filter(Boolean).join(" · ")));
    } else {
      const b = el("b", "", "“update the TV weather”");
      meta.append("Ask Claude: ", b);
    }

    const days = Array.isArray(d.days) ? d.days.slice(0, 7) : [];
    const mini = $("home-days");
    mini.textContent = "";
    for (const day of (days.length ? days.slice(0, 4) : [null, null, null, null])) {
      const c = el("div", "cell");
      c.append(el("div", "cl", day ? str(day.day, DASH) : DASH));
      c.append(el("div", "ci", day ? str(day.icon, "·") : "·"));
      c.append(el("div", "cv", day ? num(day.high) + (typeof day.high === "number" ? "°" : "") : DASH));
      c.append(el("div", "cvsub", day && typeof day.low === "number" ? num(day.low) + "°" : DASH));
      mini.append(c);
    }

    const grid = $("wx-days");
    grid.textContent = "";
    for (const day of (days.length ? days : Array(5).fill(null))) {
      const c = el("div", "wx-day");
      c.append(el("div", "cl", day ? [str(day.day, DASH),
        day.date ? str(day.date).slice(8, 10) + "/" + str(day.date).slice(5, 7) : null]
        .filter(Boolean).join(" ") : DASH));
      c.append(el("div", "ci", day ? str(day.icon, "·") : "·"));
      c.append(el("div", "hi", day ? num(day.high) + (typeof day.high === "number" ? "°" : "") : DASH));
      c.append(el("div", "lo", day && typeof day.low === "number" ? "low " + num(day.low) + "°" : DASH));
      c.append(el("div", "rain", day && day.rain ? "rain " + str(day.rain) : ""));
      if (day && day.text) c.append(el("div", "txt", str(day.text)));
      grid.append(c);
    }
  }

  /* ── snow rendering ────────────────────────────────────── */
  const camDocs = {};   // id -> data
  function badgeFor(status) {
    const s = (status || "").toLowerCase();
    if (!s) return null;
    const cls = /open/.test(s) ? "open" : /(hold|wind|weather|delay)/.test(s) ? "warn" : "off";
    const b = el("span", "badge " + cls, status);
    return b;
  }
  function renderSnow() {
    // home summary rows
    const rows = $("home-snow");
    rows.textContent = "";
    let newest = null;
    for (const r of RESORTS) {
      const d = camDocs[r.id] || {};
      const rep = d.report || {};
      const row = el("div", "stat");
      row.append(el("span", "", r.name));
      const right = el("b", "", [rep.base ? str(rep.base) : null,
        rep.lifts ? "lifts " + str(rep.lifts) : null].filter(Boolean).join(" · ") || DASH);
      const bd = badgeFor(rep.status);
      const wrap = el("div", "");
      wrap.style.display = "flex"; wrap.style.gap = "1.2vmin"; wrap.style.alignItems = "center";
      if (bd) wrap.append(bd);
      wrap.append(right);
      row.append(wrap);
      rows.append(row);
      if (d.fetchedAt && (!newest || d.fetchedAt > newest)) newest = d.fetchedAt;
    }
    $("home-snow-when").textContent = newest ? "updated " + ago(newest) : "snow";

    // full snow view
    const grid = $("snow-grid");
    grid.textContent = "";
    for (const r of RESORTS) {
      const d = camDocs[r.id] || {};
      const rep = d.report || {};
      const cam = el("div", "cam");
      const head = el("div", "pname", "");
      head.append(document.createTextNode(str(d.name, r.name)));
      const bd = badgeFor(rep.status);
      if (bd) head.append(bd);
      cam.append(head);

      const frame = el("div", "cam-frame");
      const img = el("img");
      img.alt = r.name + " snow cam";
      if (typeof d.image === "string" && d.image.startsWith("data:image/")) {
        img.src = d.image;
        img.style.display = "block";
      } else {
        const empty = el("div", "cam-empty");
        empty.innerHTML =
          '<svg viewBox="0 0 90 60" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">' +
          '<path d="M2 54 L28 18 L40 34 L52 10 L88 54 Z"/>' +
          '<path d="M46 22 L52 10 L58 22" opacity=".6"/></svg>';
        empty.append(el("div", "", "no image yet — “update the snow cams”"));
        frame.append(empty);
      }
      frame.append(img);
      cam.append(frame);

      const stats = el("div", "cam-stats");
      const s1 = el("div", "stat"); s1.append(el("span", "", "Base"), el("b", "", str(rep.base)));
      const s2 = el("div", "stat"); s2.append(el("span", "", "Lifts"), el("b", "", str(rep.lifts)));
      stats.append(s1, s2);
      if (rep.note) {
        const s3 = el("div", "stat"); s3.append(el("span", "", "Word is"), el("b", "", str(rep.note)));
        stats.append(s3);
      }
      cam.append(stats);
      const when = ago(d.fetchedAt);
      cam.append(el("div", "cam-when",
        [when ? "fetched " + when : null, d.source ? "· " + str(d.source) : null]
          .filter(Boolean).join(" ") || "awaiting first fetch"));
      grid.append(cam);
    }
  }
  renderSnow();
  renderWeather(null);

  /* ── freshness footer ──────────────────────────────────── */
  let wxAt = null;
  function renderFreshness() {
    const bits = [];
    if (wxAt) bits.push("weather " + ago(wxAt));
    const camAt = Object.values(camDocs).map(d => d.fetchedAt).filter(Boolean).sort().pop();
    if (camAt) bits.push("cams " + ago(camAt));
    $("freshness").textContent = bits.join(" · ");
  }
  setInterval(renderFreshness, 60000);

  /* ── database wiring ───────────────────────────────────── */
  (async () => {
    const db = await window.claude.use("db");
    const dot = $("livedot"), label = $("livelabel");
    if (!db) {
      label.textContent = "offline — open via claude.ai";
      return;
    }
    dot.classList.add("on");
    label.textContent = "live";
    const dead = e => { dot.classList.remove("on"); label.textContent = "reconnect: reload page"; };

    db.doc("tv/state").onSnapshot(snap => {
      const d = snap.data() || {};
      showView(str(d.view, "home"));
      const note = typeof d.note === "string" ? d.note.trim() : "";
      $("note-text").textContent = note || "Nothing on the board.";
      const hn = $("homenote");
      hn.textContent = note;
      hn.style.display = note ? "block" : "none";
    }, dead);

    db.doc("tv/weather").onSnapshot(snap => {
      const d = snap.data();
      wxAt = d && d.fetchedAt || null;
      renderWeather(d);
      renderFreshness();
    }, dead);

    db.collection("cams").onSnapshot(snap => {
      for (const doc of snap.docs) camDocs[doc.id] = doc.data() || {};
      renderSnow();
      renderFreshness();
    }, dead);
  })();

  /* ── TV niceties ───────────────────────────────────────── */
  // hide the cursor after a few idle seconds
  let cursorTimer;
  function bumpCursor() {
    document.body.classList.remove("hide-cursor");
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(() => document.body.classList.add("hide-cursor"), 4000);
  }
  addEventListener("mousemove", bumpCursor);
  bumpCursor();

  // keep the screen awake where the browser allows it
  async function wakeLock() {
    try { await navigator.wakeLock.request("screen"); } catch (e) { /* fine */ }
  }
  wakeLock();
  document.addEventListener("visibilitychange",
    () => { if (!document.hidden) wakeLock(); });

  // quiet daily reload (04:30) to pick up any republished page
  const now = new Date();
  const next = new Date(now); next.setHours(4, 30, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  setTimeout(() => location.reload(), next - now);
})();
</script>
