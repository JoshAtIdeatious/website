<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ms-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <!-- The chair materialises: solid at the bottom, fading out towards the top -->
    <linearGradient id="ms-chair" gradientUnits="userSpaceOnUse" x1="0" y1="55" x2="0" y2="20">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ms-bg)"/>
  <!-- Stick figure -->
  <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="17" cy="17.5" r="5" />
    <path d="M17 22.5v14.5M17 37l-5.5 13M17 37l5.5 13M17 28.5l-6.5 5.5M17 28.5l8 -4"/>
  </g>
  <!-- Wand -->
  <path d="M25 24.5 33.5 17" stroke="#ffd166" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M35.5 10.2l1.3 3.6 3.6 1.3-3.6 1.3-1.3 3.6-1.3-3.6-3.6-1.3 3.6-1.3z" fill="#ffd166"/>
  <!-- Sparkle trail into the chair -->
  <g fill="#ffe7a3">
    <circle cx="41" cy="18.5" r="1.3"/>
    <circle cx="45.5" cy="20" r="1.1"/>
    <circle cx="49.5" cy="19.5" r="0.9"/>
    <path d="M53 12.5l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/>
  </g>
  <!-- Chair in three-quarter view: seat, legs and a ladder back receding to the right -->
  <g fill="none" stroke="url(#ms-chair)" stroke-linecap="round" stroke-linejoin="round">
    <!-- hidden back-left leg, drawn fainter -->
    <path d="M44.5 37.5V46.5" stroke-width="2" stroke-opacity="0.55"/>
    <!-- backrest: two posts, top rail and a middle rail -->
    <path d="M44.5 37.5V22.5M56 40V25M44.5 23l11.5 2.5M44.5 29.5 56 32" stroke-width="2.6"/>
    <!-- seat top (a parallelogram seen from above) with its front edge thickness -->
    <path d="M38.5 41 50 43.5 56 40 44.5 37.5z" fill="url(#ms-chair)" fill-opacity="0.35" stroke-width="2.4"/>
    <path d="M38.5 41v1.6L50 45.1v-1.6M50 45.1 56 41.6V40" stroke-width="1.8"/>
    <!-- front-left, front-right and back-right legs -->
    <path d="M39 42.5V52.5M49.8 45V55M55.6 41.5V51" stroke-width="2.6"/>
  </g>
</svg>
